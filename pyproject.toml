[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ICN",
  "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE", "RUF",
  "S", "SIM", "SLF", "T20", "TC", "TID", "UP", "W",
]
ignore = [
  "D202",    # No blank lines allowed after function docstring
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "E501",    # Line length is handled by the formatter
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR2004", # Magic value used in comparison
  "TC001", "TC002", "TC003", # Imports used only for typing stay at the top
  "RUF001", "RUF002", "RUF003", # DTEK data is Ukrainian: Cyrillic is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "PLR0915", "PLR0917", "S101", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
